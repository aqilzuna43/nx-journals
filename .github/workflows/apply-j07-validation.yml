          ''',
              '''STEP_BODY_TOKENS = (
              "MANIFOLD_SOLID_BREP",
              "BREP_WITH_VOIDS",
              "FACETED_BREP",
              "SHELL_BASED_SURFACE_MODEL",
              "CLOSED_SHELL",
              "OPEN_SHELL",
              "ADVANCED_FACE",
              "TESSELLATED_SHAPE_REPRESENTATION",
          )
          STEP_ASSEMBLY_TOKENS = (
              "NEXT_ASSEMBLY_USAGE_OCCURRENCE",
              "CONTEXT_DEPENDENT_SHAPE_REPRESENTATION",
              "REPRESENTATION_RELATIONSHIP_WITH_TRANSFORMATION",
              "MAPPED_ITEM",
          )

          MAX_DRAWING_DATASET_INDEX = 9
          MAX_STEP_COMPONENT_OCCURRENCES = 20000
          CLOSE_PARTS_OPENED_BY_JOURNAL = True
          ''',
              "STEP configuration",
          )

          helper_marker = '''def part_body_count(part):
              try:
                  return int(part.Bodies.Count)
              except Exception:
                  pass

              try:
                  return len(list(part.Bodies))
