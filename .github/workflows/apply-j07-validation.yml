          )

          journal = replace_once(
              journal,
              '''STEP_BODY_TOKENS = (
              "MANIFOLD_SOLID_BREP",
              "BREP_WITH_VOIDS",
              "FACETED_BREP",
              "SHELL_BASED_SURFACE_MODEL",
              "CLOSED_SHELL",
