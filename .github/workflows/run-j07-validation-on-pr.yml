name: Finalize J07 validation harness

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix-test-and-clean:
    if: github.head_ref == 'agent/j07-nx2506-step-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix capability method access
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('from_git/journals/07_datapack_pdf_step_export.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    getter = step_safe_property(
                  session,
                  "GetEnvironmentVariableValue",
                  None,
              )
              if callable(getter):
              ''',
                  '''    try:
                  getter = getattr(session, "GetEnvironmentVariableValue")
              except Exception:
                  getter = None
              if callable(getter):
              ''',
                  'runtime version getter',
              ),
              (
                  '''    ensure = step_safe_property(parts, "EnsurePartsLoadedFully", None)
              if callable(ensure):
              ''',
                  '''    try:
                  ensure = getattr(parts, "EnsurePartsLoadedFully")
              except Exception:
                  ensure = None
              if callable(ensure):
              ''',
                  'full-load capability getter',
              ),
              (
                  '''    load_fully = step_safe_property(part, "LoadFully", None)
              if callable(load_fully):
              ''',
                  '''    try:
                  load_fully = getattr(part, "LoadFully")
              except Exception:
                  load_fully = None
              if callable(load_fully):
              ''',
                  'LoadFully fallback getter',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f'{label}: expected one match, found {count}'
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Journal 7
        shell: bash
        run: |
          python -m py_compile from_git/journals/07_datapack_pdf_step_export.py
          python -m unittest discover -s tests -p 'test_journal07_step_validation.py'

      - name: Commit final tested changes
        shell: bash
        run: |
          rm -f J07_VALIDATION_RESULT.txt
          rm -f .github/workflows/apply-j07-validation.yml
          rm -f .github/workflows/run-j07-validation-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add from_git/journals/07_datapack_pdf_step_export.py tests/test_journal07_step_validation.py
          git add -u .github/workflows J07_VALIDATION_RESULT.txt
          git status --short
          git commit -m "Harden J07 STEP validation for NX2506"
          git push origin HEAD:${{ github.head_ref }}
