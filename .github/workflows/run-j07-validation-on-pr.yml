name: Run J07 validation patch on PR

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/j07-nx2506-step-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-j07-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Validate patch"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script_lines = []
          for line in text[start:end].splitlines():
              if line.startswith('          '):
                  line = line[10:]
              script_lines.append(line)
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, str(workflow) + ':embedded', 'exec'))
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile from_git/journals/07_datapack_pdf_step_export.py
          python -m unittest discover -s tests -p 'test_journal07_step_validation.py'

      - name: Commit tested changes
        shell: bash
        run: |
          rm .github/workflows/apply-j07-validation.yml
          rm .github/workflows/run-j07-validation-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add from_git/journals/07_datapack_pdf_step_export.py tests/test_journal07_step_validation.py .github/workflows
          git commit -m "Harden J07 STEP validation for NX2506"
          git push origin HEAD:${{ github.head_ref }}
